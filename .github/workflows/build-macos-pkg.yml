name: Build macOS installer

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/build-macos-pkg.yml']

permissions:
  contents: read

jobs:
  package:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build universal app
        run: |
          command -v ninja || brew install ninja
          git clone --depth 1 --branch 8.0.10 https://github.com/juce-framework/JUCE.git "$RUNNER_TEMP/JUCE"
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            '-DCMAKE_OSX_ARCHITECTURES=arm64;x86_64' \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=12.0 \
            -DFETCHCONTENT_SOURCE_DIR_JUCE="$RUNNER_TEMP/JUCE"
          cmake --build build --target PluginAnalyser --parallel 2
      - name: Verify and package app
        run: |
          app='build/Plugin Analyser.app'
          lipo -verify_arch arm64 x86_64 "$app/Contents/MacOS/Plugin Analyser"
          codesign --force --sign - "$app"
          codesign --verify --strict "$app"
          pkgbuild --component "$app" --install-location /Applications \
            --version 1.0.0 PluginAnalyser-macOS.pkg
          pkgutil --payload-files PluginAnalyser-macOS.pkg
      - uses: actions/upload-artifact@v4
        with:
          name: PluginAnalyser-macOS
          path: PluginAnalyser-macOS.pkg
          if-no-files-found: error
